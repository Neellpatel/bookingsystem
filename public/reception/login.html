<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Staff Portal — Doctor on Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { ink:'#0B2B26', 'ink-surface':'#12372F', canvas:'#FBF6EA', teal:'#1F6B58', 'teal-dark':'#0B2B26', 'teal-light':'#E4EEE8', brass:'#B8924A', 'brass-light':'#F3E7C9', gold:'#D4B06A', cream:'#FBF6EA', available:'#2E7D5B', busy:'#B7791F', offduty:'#8A8577' },
    fontFamily: { display:['Newsreader','ui-serif','Georgia','serif'], sans:['Inter','ui-sans-serif','sans-serif'], mono:['"IBM Plex Mono"','ui-monospace','monospace'] },
  } } };
</script>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="reception" class="bg-ink text-white min-h-screen">

<div id="site-header"></div>

<main class="mx-auto max-w-sm px-5 py-20 anim-fade-up">
  <p class="font-mono text-xs uppercase tracking-widest text-brass mb-2">Staff only</p>
  <h1 class="font-display text-3xl mb-2">Reception portal</h1>
  <p class="text-white/60 text-sm mb-8">Take appointments on behalf of patients, and keep doctor availability up to date.</p>

  <form id="staff-login-form" class="space-y-4 bg-white/5 border border-white/10 rounded-xl p-6">
    <div>
      <label class="text-sm font-medium block mb-1.5">Staff email</label>
      <input id="email" type="email" required class="w-full rounded-lg border border-white/15 bg-white/5 px-4 py-2.5 text-white placeholder:text-white/30 focus:outline-none focus:ring-2 focus:ring-brass" placeholder="reception@doctoroncall.example">
    </div>
    <div>
      <label class="text-sm font-medium block mb-1.5">Password</label>
      <input id="password" type="password" required class="w-full rounded-lg border border-white/15 bg-white/5 px-4 py-2.5 text-white placeholder:text-white/30 focus:outline-none focus:ring-2 focus:ring-brass" placeholder="••••••••">
    </div>
    <p id="login-error" class="text-sm text-red-400 hidden"></p>
    <button type="submit" class="w-full py-3 rounded-full bg-brass text-ink font-semibold hover:brightness-110 transition">Enter reception desk</button>
  </form>

  <div class="mt-8 p-4 rounded-lg bg-white/5 border border-white/10 text-xs text-white/50 font-mono leading-relaxed">
    Demo staff login — reception@doctoroncall.example / reception123
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/anim.js"></script>
<script src="/js/chat.js"></script>
<script>
Auth.verify().then((u) => {
  if (u && (u.role === 'staff' || u.role === 'admin')) window.location.href = '/reception/index.html';
});

document.getElementById('staff-login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  try {
    const { token, user } = await Api.post('/auth/login', {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      staff: true,
    });
    Auth.setSession(token, user);
    window.location.href = '/reception/index.html';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  }
});
</script>
</body>
</html>
