<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment — Meridian Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { ink:'#0F2A2E', canvas:'#F7F5F0', teal:'#146B5E', 'teal-dark':'#0E4E44', brass:'#C99A44', available:'#2F8F5B', busy:'#C97A2E', offduty:'#8B8577' },
    fontFamily: { display:['Fraunces','ui-serif','serif'], sans:['Inter','ui-sans-serif','sans-serif'], mono:['"IBM Plex Mono"','ui-monospace','monospace'] },
  } } };
</script>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="doctors" class="bg-canvas text-ink">

<div id="site-header"></div>

<div id="signin-gate" class="hidden mx-auto max-w-md px-5 py-24 text-center">
  <h1 class="font-display text-2xl mb-3">Sign in to book</h1>
  <p class="text-ink/60 mb-6">Create a free account or sign in to reserve your appointment — it takes less than a minute.</p>
  <div class="flex justify-center gap-3">
    <a id="signin-link" href="/login.html" class="px-6 py-3 rounded-full border border-ink/15 font-medium hover:bg-white transition">Sign in</a>
    <a id="register-link" href="/register.html" class="px-6 py-3 rounded-full bg-teal text-white font-medium hover:bg-teal-dark transition">Create account</a>
  </div>
</div>

<main id="booking-main" class="mx-auto max-w-5xl px-5 sm:px-8 py-10 hidden">
  <div id="doctor-summary" class="bg-white border border-ink/8 rounded-xl p-6 flex flex-wrap items-center gap-5 mb-8"></div>

  <div class="grid lg:grid-cols-[1.3fr_1fr] gap-8">
    <div>
      <h2 class="font-display text-xl mb-4">1. Choose a date &amp; time</h2>
      <div id="date-tabs" class="flex gap-2 overflow-x-auto pb-2 mb-5"></div>
      <div id="slot-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-2.5 min-h-[80px]">
        <div class="h-11 rounded-lg skel"></div>
        <div class="h-11 rounded-lg skel"></div>
        <div class="h-11 rounded-lg skel"></div>
      </div>

      <h2 class="font-display text-xl mt-9 mb-3">2. Reason for visit <span class="text-ink/40 text-sm font-sans font-normal">(optional)</span></h2>
      <textarea id="reason" rows="3" placeholder="e.g. Annual check-up, follow-up on test results…"
        class="w-full rounded-lg border border-ink/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brass"></textarea>

      <h2 class="font-display text-xl mt-9 mb-3">3. How would you like to pay?</h2>
      <div class="grid sm:grid-cols-2 gap-3">
        <label class="pay-option border border-ink/15 rounded-xl p-4 cursor-pointer flex items-start gap-3 hover:border-teal transition">
          <input type="radio" name="payment" value="online" class="mt-1 accent-teal" checked>
          <span>
            <span class="block font-semibold">Pay online now</span>
            <span class="block text-sm text-ink/55 mt-0.5">Secure card payment. Your slot is confirmed instantly.</span>
          </span>
        </label>
        <label class="pay-option border border-ink/15 rounded-xl p-4 cursor-pointer flex items-start gap-3 hover:border-teal transition">
          <input type="radio" name="payment" value="pay_at_hospital" class="mt-1 accent-teal">
          <span>
            <span class="block font-semibold">Pay at the hospital</span>
            <span class="block text-sm text-ink/55 mt-0.5">Reserve now, settle the consultation fee at the front desk on arrival.</span>
          </span>
        </label>
      </div>
    </div>

    <aside class="bg-white border border-ink/8 rounded-xl p-6 h-fit sticky top-6">
      <h3 class="font-display text-lg mb-4">Booking summary</h3>
      <dl class="space-y-3 text-sm">
        <div class="flex justify-between"><dt class="text-ink/50">Doctor</dt><dd id="sum-doctor" class="font-medium text-right">—</dd></div>
        <div class="flex justify-between"><dt class="text-ink/50">Date</dt><dd id="sum-date" class="font-medium">—</dd></div>
        <div class="flex justify-between"><dt class="text-ink/50">Time</dt><dd id="sum-time" class="font-medium font-mono">—</dd></div>
        <div class="flex justify-between pt-3 border-t border-ink/10"><dt class="text-ink/50">Consultation fee</dt><dd id="sum-fee" class="font-semibold font-mono">—</dd></div>
      </dl>
      <button id="confirm-btn" disabled class="w-full mt-6 py-3.5 rounded-full bg-teal text-white font-semibold disabled:opacity-40 disabled:cursor-not-allowed hover:bg-teal-dark transition">
        Select a time slot
      </button>
      <p id="booking-error" class="text-sm text-red-600 mt-3 hidden"></p>
    </aside>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
const doctorId = new URLSearchParams(location.search).get('doctorId');
let selectedDate = null, selectedSlot = null, doctor = null;

function todayPlus(n) { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function dayLabel(dateStr, i) {
  if (i === 0) return 'Today';
  if (i === 1) return 'Tomorrow';
  return new Date(dateStr + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' });
}

async function init() {
  if (!doctorId) { document.getElementById('booking-main').innerHTML = '<p class="py-24 text-center text-ink/50">No doctor selected. <a href="/doctors.html" class="text-teal underline">Browse doctors →</a></p>'; document.getElementById('booking-main').classList.remove('hidden'); return; }
  if (!Auth.isLoggedIn()) {
    const gate = document.getElementById('signin-gate');
    const ret = encodeURIComponent('/book.html?doctorId=' + doctorId);
    document.getElementById('signin-link').href = '/login.html?redirect=' + ret;
    document.getElementById('register-link').href = '/register.html?redirect=' + ret;
    gate.classList.remove('hidden');
    return;
  }
  document.getElementById('booking-main').classList.remove('hidden');

  try {
    const { doctor: d } = await Api.get('/doctors/' + doctorId);
    doctor = d;
    renderDoctorSummary(d);
    document.getElementById('sum-doctor').textContent = d.name;
    document.getElementById('sum-fee').textContent = money(d.consultationFee);
  } catch {
    document.getElementById('doctor-summary').innerHTML = '<p class="text-red-600">Could not load this doctor.</p>';
    return;
  }

  renderDateTabs();
  selectDate(todayPlus(0), 0);
}

function renderDoctorSummary(d) {
  const b = statusBadge(d.availabilityStatus);
  document.getElementById('doctor-summary').innerHTML = `
    <div class="w-16 h-16 rounded-full flex items-center justify-center text-white font-display text-xl" style="background:#146B5E">${d.name.replace('Dr. ','').split(' ').map(p=>p[0]).slice(0,2).join('')}</div>
    <div class="flex-1 min-w-[220px]">
      <div class="font-display text-xl">${d.name}</div>
      <div class="text-sm text-ink/50 font-mono">${d.specialty} · ${d.location}</div>
    </div>
    <span class="inline-flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full ring-1 ${b.cls}"><span class="${b.dot}"></span>${b.label}${d.statusNote ? ' — ' + d.statusNote : ''}</span>
  `;
}

function renderDateTabs() {
  const tabs = document.getElementById('date-tabs');
  tabs.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const date = todayPlus(i);
    const btn = document.createElement('button');
    btn.className = 'date-tab shrink-0 px-4 py-2.5 rounded-lg border border-ink/15 text-sm font-medium hover:border-teal transition';
    btn.textContent = dayLabel(date, i);
    btn.dataset.date = date;
    btn.addEventListener('click', () => selectDate(date, i));
    tabs.appendChild(btn);
  }
}

async function selectDate(date, i) {
  selectedDate = date; selectedSlot = null;
  document.querySelectorAll('.date-tab').forEach(t => t.classList.toggle('bg-teal', t.dataset.date === date));
  document.querySelectorAll('.date-tab').forEach(t => t.classList.toggle('text-white', t.dataset.date === date));
  updateSummary();
  const grid = document.getElementById('slot-grid');
  grid.innerHTML = '<div class="h-11 rounded-lg skel"></div><div class="h-11 rounded-lg skel"></div><div class="h-11 rounded-lg skel"></div>';
  try {
    const { slots } = await Api.get(`/doctors/${doctorId}/slots?date=${date}`);
    grid.innerHTML = slots.length ? slots.map(s => `
      <button class="slot-btn px-3 py-2.5 rounded-lg border border-ink/15 text-sm font-mono hover:border-teal transition" data-slot-id="${s.id}" data-start="${s.startTime}" data-end="${s.endTime}">
        ${fmtTime(s.startTime)}
      </button>`).join('') : '<p class="col-span-full text-sm text-ink/50 py-4">No openings this day — try another date.</p>';
    grid.querySelectorAll('.slot-btn').forEach(btn => btn.addEventListener('click', () => selectSlot(btn)));
  } catch {
    grid.innerHTML = '<p class="col-span-full text-sm text-red-600 py-4">Could not load time slots.</p>';
  }
}

function selectSlot(btn) {
  document.querySelectorAll('.slot-btn').forEach(b => { b.classList.remove('bg-teal', 'text-white', 'border-teal'); });
  btn.classList.add('bg-teal', 'text-white', 'border-teal');
  selectedSlot = { id: btn.dataset.slotId, start: btn.dataset.start, end: btn.dataset.end };
  updateSummary();
}

function updateSummary() {
  document.getElementById('sum-date').textContent = selectedDate ? fmtDate(selectedDate) : '—';
  document.getElementById('sum-time').textContent = selectedSlot ? `${fmtTime(selectedSlot.start)} – ${fmtTime(selectedSlot.end)}` : '—';
  const btn = document.getElementById('confirm-btn');
  if (selectedSlot) { btn.disabled = false; btn.textContent = 'Confirm appointment'; }
  else { btn.disabled = true; btn.textContent = 'Select a time slot'; }
}

document.getElementById('confirm-btn').addEventListener('click', async () => {
  const errEl = document.getElementById('booking-error');
  errEl.classList.add('hidden');
  const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
  const reason = document.getElementById('reason').value.trim();
  const btn = document.getElementById('confirm-btn');
  btn.disabled = true; btn.textContent = 'Booking…';
  try {
    const { appointment } = await Api.post('/appointments', {
      doctorId, slotId: selectedSlot.id, reason, paymentMethod,
    });
    if (paymentMethod === 'online') {
      window.location.href = '/payment.html?appointmentId=' + appointment.id;
    } else {
      window.location.href = '/dashboard.html?booked=1';
    }
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Confirm appointment';
  }
});

init();
</script>
</body>
</html>
