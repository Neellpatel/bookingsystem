        fill="url(#favGold)" stroke="#051713" stroke-width="0.8"/>

  <!-- Lifeline Center Pulse -->
  <path d="M 9.5 16 L 12.5 16 L 14.5 13.5 L 16 18.5 L 17.5 14 L 19 16.5 L 22.5 16" 
